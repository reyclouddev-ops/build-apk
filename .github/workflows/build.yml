name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: Flutter project ZIP URL
        required: true
        type: string
      tag:
        description: Build tag
        required: true
        type: string
      build_type:
        description: Build type
        required: false
        default: release
        type: string

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.0"
          cache: true

      - name: Download Project
        env:
          ZIP_URL: ${{ inputs.zip_url }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -e
          mkdir -p project
          curl -L \
            --fail-with-body \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 600 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -H "User-Agent: FlutterBuildBot" \
            "$ZIP_URL" \
            -o project/project.zip
          test -s project/project.zip
          unzip -q project/project.zip -d project
          rm -f project/project.zip

      - name: Find Flutter Project
        id: project
        run: |
          set -e
          PUBSPEC=$(find project -type f -name pubspec.yaml -print -quit)
          test -n "$PUBSPEC"
          DIR=$(dirname "$PUBSPEC")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Prepare Android
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi

          if [ -f android/gradle.properties ]; then
            grep -q '^android.useAndroidX=' android/gradle.properties || echo 'android.useAndroidX=true' >> android/gradle.properties
            grep -q '^android.enableJetifier=' android/gradle.properties || echo 'android.enableJetifier=true' >> android/gradle.properties
          else
            printf '%s\n' \
              'android.useAndroidX=true' \
              'android.enableJetifier=true' \
              > android/gradle.properties
          fi

      - name: Install Dependencies
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -e
          cd "$PROJECT_DIR"
          flutter clean
          rm -rf .dart_tool build
          flutter pub get

      - name: Analyze Project
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -e
          cd "$PROJECT_DIR"
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"

          rm -rf build
          flutter pub get

          if [ "$BUILD_TYPE" = "debug" ]; then
            flutter build apk --debug 2>&1 | tee build.log
          elif [ "$BUILD_TYPE" = "profile" ]; then
            flutter build apk --profile 2>&1 | tee build.log
          else
            flutter build apk --release 2>&1 | tee build.log
          fi

      - name: Find APK
        id: apk
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -e
          APK=$(find "$PROJECT_DIR/build/app/outputs" \
            -type f \
            -name "*.apk" \
            -print \
            -quit)
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk-${{ inputs.tag }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TAG: ${{ inputs.tag }}
        run: |
          set -e
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Build $TAG" \
            --prerelease \
            --generate-notes=false

      - name: Upload APK Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TAG: ${{ inputs.tag }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          set -e
          gh release upload "$TAG" \
            "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Build Success
        run: echo "BUILD SUCCESS"
