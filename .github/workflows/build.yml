name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: Flutter project ZIP URL
        required: true
        type: string
      tag:
        description: Build tag
        required: true
        type: string
      build_type:
        description: Build type
        required: false
        default: release
        type: string

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.0"
          cache: true

      - name: Download Project
        env:
          ZIP_URL: ${{ inputs.zip_url }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -e

          rm -rf project
          mkdir -p project

          curl \
            --location \
            --fail-with-body \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 900 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -H "User-Agent: FlutterBuildBot" \
            "$ZIP_URL" \
            -o project/project.zip

          test -s project/project.zip

          unzip -q project/project.zip -d project

          rm -f project/project.zip

      - name: Find Flutter Project
        id: project
        run: |
          set -e

          PUBSPEC=$(find project \
            -type f \
            -name "pubspec.yaml" \
            -print \
            -quit)

          if [ -z "$PUBSPEC" ]; then
            exit 1
          fi

          DIR=$(dirname "$PUBSPEC")

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Prepare Android
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -f lib/main.dart ]; then
            exit 1
          fi

          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi

          chmod +x android/gradlew

      - name: Configure Android
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          touch android/gradle.properties

          grep -q "^android.useAndroidX=" android/gradle.properties || \
            echo "android.useAndroidX=true" >> android/gradle.properties

          grep -q "^android.enableJetifier=" android/gradle.properties || \
            echo "android.enableJetifier=true" >> android/gradle.properties

          grep -q "^org.gradle.jvmargs=" android/gradle.properties || \
            echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> android/gradle.properties

      - name: Install Dependencies
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          rm -rf .dart_tool build

          flutter pub get

      - name: Build APK
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ "$BUILD_TYPE" = "debug" ]; then
            flutter build apk --debug
          elif [ "$BUILD_TYPE" = "profile" ]; then
            flutter build apk --profile
          else
            flutter build apk --release
          fi

      - name: Find APK
        id: apk
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/build/app/outputs" \
            -type f \
            -name "*.apk" \
            -print \
            -quit)

          if [ -z "$APK" ]; then
            exit 1
          fi

          APK=$(realpath "$APK")

          echo "path=$APK" >> "$GITHUB_OUTPUT"

          ls -lh "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk-${{ inputs.tag }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TAG: ${{ inputs.tag }}
        run: |
          set -e

          if ! gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then

            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Build $TAG" \
              --prerelease \
              --generate-notes=false
          fi

      - name: Upload APK Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TAG: ${{ inputs.tag }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          set -e

          gh release upload "$TAG" \
            "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Complete
        run: |
          echo "BUILD SUCCESS"
