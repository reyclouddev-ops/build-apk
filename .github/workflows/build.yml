name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: Flutter project ZIP URL
        required: true
        type: string
      tag:
        description: Build tag
        required: true
        type: string
      build_type:
        description: Build type
        required: false
        default: release
        type: string

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Check Environment
        run: |
          flutter --version
          dart --version
          java -version

      - name: Download Project
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          set -e

          mkdir -p project/source

          if [ -z "$GH_TOKEN" ]; then
            echo "GH_PAT belum tersedia"
            exit 1
          fi

          if [ -z "$ZIP_URL" ]; then
            echo "ZIP URL belum tersedia"
            exit 1
          fi

          echo "Downloading project..."

          curl \
            -L \
            --fail-with-body \
            --retry 8 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 900 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -H "User-Agent: FlutterBuildBot" \
            "$ZIP_URL" \
            -o project/project.zip

          test -s project/project.zip

          echo "Checking ZIP..."
          unzip -t project/project.zip

          echo "Extracting..."
          unzip -q project/project.zip -d project/source

          echo "Project extracted"

      - name: Find Flutter Project
        id: project
        run: |
          set -e

          FILE=$(find project/source -name pubspec.yaml -type f | head -1)

          if [ -z "$FILE" ]; then
            echo "pubspec.yaml tidak ditemukan"
            find project/source -maxdepth 5 -type f | head -200
            exit 1
          fi

          DIR=$(dirname "$FILE")

          echo "Project directory: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Flutter Pub Get
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          flutter pub get

      - name: Prepare Android
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -d android ]; then
            flutter create \
              --platforms=android \
              --project-name flutter_build_app \
              .
          fi

          if [ ! -f android/gradlew ]; then
            echo "gradlew tidak ditemukan"
            exit 1
          fi

          chmod +x android/gradlew

      - name: Analyze
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        continue-on-error: true
        run: |
          cd "$PROJECT_DIR"

          flutter analyze > analyze.log 2>&1 || true

          cat analyze.log

      - name: Build APK
        id: build
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          rm -f build_output.log

          flutter clean
          flutter pub get

          if [ "$BUILD_TYPE" = "debug" ]; then
            flutter build apk \
              --debug \
              --android-skip-build-dependency-validation \
              2>&1 | tee build_output.log
          elif [ "$BUILD_TYPE" = "profile" ]; then
            flutter build apk \
              --profile \
              --android-skip-build-dependency-validation \
              2>&1 | tee build_output.log
          else
            flutter build apk \
              --release \
              --android-skip-build-dependency-validation \
              2>&1 | tee build_output.log
          fi

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ inputs.tag }}
          path: |
            project/source/**/build_output.log
            project/source/**/analyze.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Find APK
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          APK=$(find build/app/outputs -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "APK tidak ditemukan"
            find build -type f 2>/dev/null | head -100
            exit 1
          fi

          mkdir -p build/final

          cp "$APK" build/final/release.apk

          ls -lh build/final/release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk-${{ inputs.tag }}
          path: ${{ steps.project.outputs.dir }}/build/final/release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Create Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TAG: ${{ inputs.tag }}
        run: |
          set -e

          RESPONSE=$(curl \
            --silent \
            --show-error \
            --fail-with-body \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 120 \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"Build $TAG\",\"draft\":false,\"prerelease\":true}")

          echo "$RESPONSE" > release.json

          RELEASE_ID=$(python3 -c "import json; print(json.load(open('release.json')).get('id',''))")

          UPLOAD_URL=$(python3 -c "import json; print(json.load(open('release.json')).get('upload_url','').split('{')[0])")

          if [ -z "$RELEASE_ID" ]; then
            echo "Release gagal dibuat"
            cat release.json
            exit 1
          fi

          if [ -z "$UPLOAD_URL" ]; then
            echo "Upload URL tidak ditemukan"
            cat release.json
            exit 1
          fi

          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "upload_url=$UPLOAD_URL" >> "$GITHUB_OUTPUT"

      - name: Upload APK Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          UPLOAD_URL: ${{ steps.release.outputs.upload_url }}
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
          TAG: ${{ inputs.tag }}
        run: |
          set -e

          APK="$PROJECT_DIR/build/final/release.apk"
          NAME="app-$TAG.apk"

          test -s "$APK"

          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --retry 8 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 900 \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "User-Agent: FlutterBuildBot" \
            --data-binary "@$APK" \
            "$UPLOAD_URL?name=$NAME"

      - name: Finish
        run: |
          echo "================================"
          echo "BUILD SUCCESS"
          echo "================================"
          echo "Tag: ${{ inputs.tag }}"
          echo "Build type: ${{ inputs.build_type }}"
