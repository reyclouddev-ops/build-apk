name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: Flutter project ZIP URL
        required: true
        type: string
      tag:
        description: Build tag
        required: true
        type: string
      build_type:
        description: Build type
        required: false
        default: debug
        type: string

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.0"
          cache: true

      - name: Download Project
        env:
          ZIP_URL: ${{ inputs.zip_url }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -e
          rm -rf project
          mkdir -p project
          curl -L \
            --fail-with-body \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 600 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -H "User-Agent: FlutterBuildBot" \
            "$ZIP_URL" \
            -o project/project.zip
          test -s project/project.zip
          unzip -oq project/project.zip -d project
          rm -f project/project.zip

      - name: Find Latest Flutter Project
        id: project
        run: |
          set -e

          mapfile -t PUBSPECS < <(find "$GITHUB_WORKSPACE/project" -type f -name "pubspec.yaml" -printf '%T@ %p\n' | sort -nr | cut -d' ' -f2-)

          if [ "${#PUBSPECS[@]}" -eq 0 ]; then
            echo "pubspec.yaml tidak ditemukan"
            exit 1
          fi

          PUBSPEC="${PUBSPECS[0]}"
          PROJECT_DIR="$(dirname "$PUBSPEC")"

          echo "PUBSPEC=$PUBSPEC"
          echo "PROJECT_DIR=$PROJECT_DIR"

          echo "Semua pubspec:"
          printf '%s\n' "${PUBSPECS[@]}"

          echo "Dependency dartssh2:"
          grep -n "dartssh2" "$PUBSPEC" || true

          echo "Dependency awesome_notifications:"
          grep -n "awesome_notifications" "$PUBSPEC" || true

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "pubspec=$PUBSPEC" >> "$GITHUB_OUTPUT"

      - name: Prepare Project
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -e

          test -f "$PROJECT_DIR/pubspec.yaml"

          cd "$PROJECT_DIR"

          echo "Project: $PROJECT_DIR"
          echo "Pubspec:"
          cat pubspec.yaml

          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi

          flutter clean
          rm -rf .dart_tool build
          rm -f pubspec.lock

          flutter --version
          dart --version

          flutter pub get

          test -f pubspec.lock

      - name: Configure Android
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          mkdir -p android
          touch android/gradle.properties

          grep -q '^android.useAndroidX=' android/gradle.properties || echo 'android.useAndroidX=true' >> android/gradle.properties
          grep -q '^android.enableJetifier=' android/gradle.properties || echo 'android.enableJetifier=true' >> android/gradle.properties
          grep -q '^org.gradle.jvmargs=' android/gradle.properties || echo 'org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8' >> android/gradle.properties

      - name: Build APK
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          case "$BUILD_TYPE" in
            debug)
              flutter build apk --debug
              ;;
            profile)
              flutter build apk --profile
              ;;
            release)
              flutter build apk --release
              ;;
            *)
              flutter build apk --debug
              ;;
          esac

      - name: Find APK
        id: apk
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -e

          APK="$(find "$PROJECT_DIR/build/app/outputs" -type f -name "*.apk" -print | head -n 1)"

          if [ -z "$APK" ]; then
            echo "APK tidak ditemukan"
            find "$PROJECT_DIR/build" -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK=$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk-${{ inputs.tag }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TAG: ${{ inputs.tag }}
        run: |
          set -e

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Build $TAG" \
            --prerelease \
            --draft \
            --generate-notes=false

      - name: Upload APK Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TAG: ${{ inputs.tag }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          set -e

          gh release upload "$TAG" \
            "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TAG: ${{ inputs.tag }}
        run: |
          set -e

          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
