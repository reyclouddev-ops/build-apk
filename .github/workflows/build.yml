name: Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL GitHub Release Asset ZIP"
        required: true
        type: string

      tag:
        description: "Build tag"
        required: false
        default: "latest"
        type: string

      build_type:
        description: "Build type"
        required: false
        default: "release"
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # DOWNLOAD ZIP
      # ============================================================

      - name: Download Project ZIP
        env:
          ZIP_URL: ${{ inputs.zip_url }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -e

          mkdir -p project

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "❌ GH_PAT tidak tersedia."
            echo "Pastikan GH_PAT berada di Repository secrets."
            exit 1
          fi

          echo "📦 Downloading Flutter project..."

          curl -L \
            --fail-with-body \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            "${ZIP_URL}" \
            -o project/project.zip

          echo "📁 File information:"
          ls -lh project/project.zip

          file project/project.zip

          if ! unzip -t project/project.zip >/dev/null 2>&1; then
            echo "❌ File yang didownload bukan ZIP yang valid."
            exit 1
          fi

          echo "✅ ZIP valid."


      # ============================================================
      # EXTRACT
      # ============================================================

      - name: Extract Project
        run: |
          set -e

          mkdir -p project/source

          unzip -q project/project.zip -d project/source

          echo "✅ Project berhasil diekstrak."


      # ============================================================
      # FIND FLUTTER PROJECT
      # ============================================================

      - name: Find Flutter Project
        run: |
          set -e

          PROJECT_DIR=$(find project/source \
            -type f \
            -name "pubspec.yaml" \
            -printf '%h\n' \
            | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "❌ pubspec.yaml tidak ditemukan."
            echo "ZIP harus berisi project Flutter."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "✅ Flutter project ditemukan:"
          echo "$PROJECT_DIR"


      # ============================================================
      # JAVA
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # FLUTTER
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      - name: Flutter Version
        run: |
          flutter --version
          dart --version


      # ============================================================
      # CHECK PROJECT
      # ============================================================

      - name: Validate Flutter Project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          if [ ! -f "pubspec.yaml" ]; then
            echo "❌ pubspec.yaml tidak ditemukan."
            exit 1
          fi

          if [ ! -d "android" ]; then
            echo "❌ Folder android tidak ditemukan."
            exit 1
          fi

          if [ ! -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "❌ Gradle wrapper tidak ditemukan."
            exit 1
          fi

          echo "✅ Flutter project valid."


      # ============================================================
      # FIX GRADLE + KOTLIN
      # ============================================================

      - name: Fix Gradle and Kotlin Compatibility
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "========================================"
          echo " FIX ANDROID BUILD CONFIGURATION"
          echo "========================================"

          GRADLE_FILE="android/gradle/wrapper/gradle-wrapper.properties"

          echo ""
          echo "🔧 Fix Gradle..."

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/gradle/wrapper/gradle-wrapper.properties")

          text = path.read_text()

          text = re.sub(
              r'gradle-[0-9]+\.[0-9]+(?:\.[0-9]+)?-(?:bin|all)\.zip',
              'gradle-8.14.0-bin.zip',
              text
          )

          path.write_text(text)
          PY

          echo "Gradle configuration:"
          grep "distributionUrl" "$GRADLE_FILE" || true


          echo ""
          echo "🔧 Fix Kotlin Gradle Plugin..."

          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/settings.gradle"),
              Path("android/settings.gradle.kts"),
              Path("android/build.gradle"),
              Path("android/build.gradle.kts"),
          ]

          for path in files:

              if not path.exists():
                  continue

              text = path.read_text()

              patterns = [

                  (
                      r'(id\s*\(\s*["\']org\.jetbrains\.kotlin\.android["\']\s*\)\s*version\s*["\'])[0-9.]+(["\'])',
                      r'\g<1>2.2.21\g<2>'
                  ),

                  (
                      r'(id\s*["\']org\.jetbrains\.kotlin\.android["\']\s*version\s*["\'])[0-9.]+(["\'])',
                      r'\g<1>2.2.21\g<2>'
                  ),

                  (
                      r'(kotlin\(["\']android["\']\)\s*version\s*["\'])[0-9.]+(["\'])',
                      r'\g<1>2.2.21\g<2>'
                  ),

                  (
                      r'(org\.jetbrains\.kotlin\.android\s*:\s*)[0-9.]+',
                      r'\g<1>2.2.21'
                  ),

              ]

              for pattern, replacement in patterns:
                  text = re.sub(
                      pattern,
                      replacement,
                      text
                  )

              path.write_text(text)
          PY

          echo ""
          echo "Kotlin configuration:"

          grep -R -n \
            -E "kotlin|org.jetbrains.kotlin" \
            android/settings.gradle \
            android/settings.gradle.kts \
            android/build.gradle \
            android/build.gradle.kts \
            2>/dev/null || true


      # ============================================================
      # ANDROID COMPATIBILITY
      # ============================================================

      - name: Configure Android Compatibility
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          PROPERTIES="android/gradle.properties"

          touch "$PROPERTIES"

          echo "🔧 Configuring Android compatibility..."

          if grep -q "^android.newDsl=" "$PROPERTIES"; then
            sed -i \
              's/^android.newDsl=.*/android.newDsl=false/' \
              "$PROPERTIES"
          else
            echo "android.newDsl=false" >> "$PROPERTIES"
          fi

          if grep -q "^android.builtInKotlin=" "$PROPERTIES"; then
            sed -i \
              's/^android.builtInKotlin=.*/android.builtInKotlin=false/' \
              "$PROPERTIES"
          else
            echo "android.builtInKotlin=false" >> "$PROPERTIES"
          fi

          echo ""
          echo "📄 Android properties:"
          cat "$PROPERTIES"


      # ============================================================
      # PUB GET
      # ============================================================

      - name: Flutter Pub Get
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "📦 Running flutter pub get..."

          flutter pub get


      # ============================================================
      # GRADLE WRAPPER
      # ============================================================

      - name: Prepare Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -e

          chmod +x gradlew

          echo "📌 Gradle version:"
          ./gradlew --version


      # ============================================================
      # CHECK ANDROID CONFIG
      # ============================================================

      - name: Check Android Configuration
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo ""
          echo "========================================"
          echo " ANDROID CONFIGURATION"
          echo "========================================"

          echo ""
          echo "Gradle:"
          grep "distributionUrl" \
            android/gradle/wrapper/gradle-wrapper.properties \
            || true

          echo ""
          echo "Kotlin:"
          grep -R -n \
            -E "kotlin.*version|org.jetbrains.kotlin" \
            android \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            2>/dev/null || true

          echo ""
          echo "Android Gradle Plugin:"
          grep -R -n \
            -E "com.android.application|com.android.library" \
            android \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            2>/dev/null || true


      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo ""
          echo "========================================"
          echo " BUILD APK"
          echo "========================================"

          if [ "${{ inputs.build_type }}" = "debug" ]; then

            echo "🔧 Building DEBUG APK..."

            flutter build apk \
              --debug

          else

            echo "🚀 Building RELEASE APK..."

            flutter build apk \
              --release

          fi


      # ============================================================
      # CHECK APK
      # ============================================================

      - name: Check APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          APK_DIR="build/app/outputs/flutter-apk"

          if [ ! -d "$APK_DIR" ]; then
            echo "❌ Folder APK tidak ditemukan."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo " APK RESULT"
          echo "========================================"

          find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;

          APK_COUNT=$(find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "❌ APK tidak ditemukan."
            exit 1
          fi

          echo ""
          echo "✅ APK berhasil dibuat."


      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.tag }}
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 7
