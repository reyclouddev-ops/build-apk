name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: Flutter project ZIP URL
        required: true
        type: string
      tag:
        description: Build tag
        required: true
        type: string
      build_type:
        description: Build type
        required: false
        default: release
        type: string

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.29.2"
          cache: true

      - name: Download Project
        env:
          ZIP_URL: ${{ inputs.zip_url }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -e
          rm -rf project
          mkdir -p project
          curl -L \
            --fail-with-body \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 600 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -H "User-Agent: FlutterBuildBot" \
            "$ZIP_URL" \
            -o project/project.zip
          test -s project/project.zip
          unzip -oq project/project.zip -d project
          rm -f project/project.zip

      - name: Find Flutter Project
        id: project
        run: |
          set -e
          PUBSPEC=$(find project -type f -name pubspec.yaml -print -quit)
          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml tidak ditemukan"
            exit 1
          fi
          DIR=$(dirname "$PUBSPEC")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Prepare Project
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi

          rm -rf .dart_tool
          rm -rf build

          flutter clean
          flutter pub get

      - name: Fix Android Configuration
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f android/gradle.properties ]; then
            grep -q '^android.useAndroidX=' android/gradle.properties || echo 'android.useAndroidX=true' >> android/gradle.properties
            grep -q '^android.enableJetifier=' android/gradle.properties || echo 'android.enableJetifier=true' >> android/gradle.properties
          else
            mkdir -p android
            printf '%s\n' \
              'android.useAndroidX=true' \
              'android.enableJetifier=true' \
              'org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8' \
              > android/gradle.properties
          fi

      - name: Validate Project
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -e
          cd "$PROJECT_DIR"
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -e
          cd "$PROJECT_DIR"

          case "$BUILD_TYPE" in
            debug)
              flutter build apk --debug
              ;;
            profile)
              flutter build apk --profile
              ;;
            release)
              flutter build apk --release
              ;;
            *)
              flutter build apk --release
              ;;
          esac

      - name: Find APK
        id: apk
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/build/app/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print \
            -quit)

          if [ -z "$APK" ]; then
            APK=$(find "$PROJECT_DIR/build/app/outputs" \
              -type f \
              -name "*.apk" \
              -print \
              -quit)
          fi

          if [ -z "$APK" ]; then
            echo "APK tidak ditemukan"
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk-${{ inputs.tag }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TAG: ${{ inputs.tag }}
        run: |
          set -e

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Build $TAG" \
            --prerelease \
            --draft \
            --generate-notes=false

      - name: Upload APK Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TAG: ${{ inputs.tag }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          set -e

          gh release upload "$TAG" \
            "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TAG: ${{ inputs.tag }}
        run: |
          set -e

          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
