name: Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL GitHub Release Asset ZIP"
        required: true
        type: string
      tag:
        description: "Build tag"
        required: false
        default: "latest"
        type: string
      build_type:
        description: "Build type"
        required: false
        default: "release"
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Project ZIP
        env:
          ZIP_URL: ${{ inputs.zip_url }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -e

          mkdir -p project

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "GH_PAT tidak tersedia."
            exit 1
          fi

          curl -L \
            --fail-with-body \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            "${ZIP_URL}" \
            -o project/project.zip

          ls -lh project/project.zip
          file project/project.zip

          if ! unzip -t project/project.zip >/dev/null 2>&1; then
            echo "File yang didownload bukan ZIP yang valid."
            exit 1
          fi

      - name: Extract Project
        run: |
          set -e

          mkdir -p project/source
          unzip -q project/project.zip -d project/source

      - name: Find Flutter Project
        run: |
          set -e

          PROJECT_DIR=$(find project/source \
            -type f \
            -name "pubspec.yaml" \
            -printf '%h\n' \
            | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "pubspec.yaml tidak ditemukan."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate Project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          test -f pubspec.yaml
          test -d android
          test -f android/gradle/wrapper/gradle-wrapper.properties

      - name: Fix Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/gradle/wrapper/gradle-wrapper.properties")
          text = path.read_text()

          text = re.sub(
              r'gradle-[0-9]+\.[0-9]+(?:\.[0-9]+)?-(?:bin|all)\.zip',
              'gradle-8.14.0-bin.zip',
              text
          )

          path.write_text(text)
          PY

      - name: Fix Kotlin
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/settings.gradle"),
              Path("android/settings.gradle.kts"),
              Path("android/build.gradle"),
              Path("android/build.gradle.kts"),
          ]

          patterns = [
              (
                  r'(id\s*\(\s*["\']org\.jetbrains\.kotlin\.android["\']\s*\)\s*version\s*["\'])[0-9.]+(["\'])',
                  r'\g<1>2.2.21\g<2>'
              ),
              (
                  r'(id\s*["\']org\.jetbrains\.kotlin\.android["\']\s*version\s*["\'])[0-9.]+(["\'])',
                  r'\g<1>2.2.21\g<2>'
              ),
              (
                  r'(kotlin\(["\']android["\']\)\s*version\s*["\'])[0-9.]+(["\'])',
                  r'\g<1>2.2.21\g<2>'
              ),
              (
                  r'(org\.jetbrains\.kotlin\.android\s*:\s*)[0-9.]+',
                  r'\g<1>2.2.21'
              )
          ]

          for path in files:
              if not path.exists():
                  continue

              text = path.read_text()

              for pattern, replacement in patterns:
                  text = re.sub(pattern, replacement, text)

              path.write_text(text)
          PY

      - name: Configure Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          PROPERTIES="android/gradle.properties"

          touch "$PROPERTIES"

          if grep -q "^android.newDsl=" "$PROPERTIES"; then
            sed -i 's/^android.newDsl=.*/android.newDsl=false/' "$PROPERTIES"
          else
            echo "android.newDsl=false" >> "$PROPERTIES"
          fi

          if grep -q "^android.builtInKotlin=" "$PROPERTIES"; then
            sed -i 's/^android.builtInKotlin=.*/android.builtInKotlin=false/' "$PROPERTIES"
          else
            echo "android.builtInKotlin=false" >> "$PROPERTIES"
          fi

      - name: Flutter Pub Get
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          flutter pub get

      - name: Prepare Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -e

          chmod +x gradlew

          echo "Gradle wrapper:"
          grep "distributionUrl" gradle/wrapper/gradle-wrapper.properties

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          if [ "${{ inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Check APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          APK_DIR="build/app/outputs/flutter-apk"

          if [ ! -d "$APK_DIR" ]; then
            echo "Folder APK tidak ditemukan."
            exit 1
          fi

          APK_COUNT=$(find "$APK_DIR" -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "APK tidak ditemukan."
            exit 1
          fi

          find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.tag }}
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 7
