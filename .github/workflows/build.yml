name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: Flutter project ZIP URL
        required: true
        type: string
      tag:
        description: Build tag
        required: true
        type: string
      build_type:
        description: Build type
        required: false
        default: release
        type: string

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Environment
        run: |
          set -e
          flutter --version
          dart --version
          java -version
          git --version

      - name: Download Project
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          set -e

          rm -rf project
          mkdir -p project/source

          test -n "$GH_TOKEN"
          test -n "$ZIP_URL"

          DOWNLOAD_URL="$ZIP_URL"

          if echo "$ZIP_URL" | grep -qE '^https://github\.com/[^/]+/[^/]+/releases/download/'; then
            RELEASE_PATH=$(printf '%s' "$ZIP_URL" | sed -E 's#^https://github\.com/([^/]+/[^/]+)/releases/download/(.*)$#\1|\2#')

            REPO=$(printf '%s' "$RELEASE_PATH" | cut -d'|' -f1)
            RELEASE_PART=$(printf '%s' "$RELEASE_PATH" | cut -d'|' -f2)

            TAG_NAME=$(printf '%s' "$RELEASE_PART" | cut -d'/' -f1)
            ASSET_NAME=$(printf '%s' "$RELEASE_PART" | cut -d'/' -f2-)

            RELEASE_JSON=$(curl \
              --silent \
              --show-error \
              --fail \
              --retry 5 \
              --retry-delay 3 \
              --connect-timeout 30 \
              --max-time 120 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "User-Agent: FlutterBuildBot/2.0" \
              "https://api.github.com/repos/$REPO/releases/tags/$TAG_NAME")

            ASSET_ID=$(printf '%s' "$RELEASE_JSON" | python3 -c '
import json
import sys

data = json.load(sys.stdin)
name = sys.argv[1]

for asset in data.get("assets", []):
    if asset.get("name") == name:
        print(asset.get("id", ""))
        break
' "$ASSET_NAME")

            if [ -z "$ASSET_ID" ]; then
              echo "Asset tidak ditemukan: $ASSET_NAME"
              exit 1
            fi

            DOWNLOAD_URL="https://api.github.com/repos/$REPO/releases/assets/$ASSET_ID"
          fi

          curl \
            --location \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 600 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -H "User-Agent: FlutterBuildBot/2.0" \
            "$DOWNLOAD_URL" \
            -o project/project.zip

          test -s project/project.zip

          file project/project.zip
          unzip -t project/project.zip
          unzip -q project/project.zip -d project/source

      - name: Detect Flutter Project
        id: detect
        run: |
          set -e

          PUBSPEC=$(find project/source -type f -name pubspec.yaml -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml tidak ditemukan"
            find project/source -maxdepth 5 -type f | sort | head -300
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Prepare Flutter
        env:
          PROJECT_DIR: ${{ steps.detect.outputs.project_dir }}
        run: |
          set -e
          cd "$PROJECT_DIR"

          flutter pub get

      - name: Detect Entry Point
        id: entry
        env:
          PROJECT_DIR: ${{ steps.detect.outputs.project_dir }}
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f lib/main.dart ]; then
            echo "entry_point=lib/main.dart" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ENTRY=$(grep -RIl --include="*.dart" "void main(" lib 2>/dev/null | head -1 || true)

          if [ -z "$ENTRY" ]; then
            echo "Entry point tidak ditemukan"
            exit 1
          fi

          echo "entry_point=$ENTRY" >> "$GITHUB_OUTPUT"

      - name: Prepare Android
        env:
          PROJECT_DIR: ${{ steps.detect.outputs.project_dir }}
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ ! -d android ]; then
            flutter create \
              --platforms=android \
              --project-name flutter_build_app \
              .
          fi

          test -d android
          test -f android/gradlew

          if [ -f android/settings.gradle ]; then
            test -f android/app/build.gradle
          elif [ -f android/settings.gradle.kts ]; then
            test -f android/app/build.gradle.kts
          else
            echo "Android Gradle configuration tidak ditemukan"
            exit 1
          fi

          chmod +x android/gradlew

      - name: Verify Gradle
        env:
          PROJECT_DIR: ${{ steps.detect.outputs.project_dir }}
        run: |
          set -e
          cd "$PROJECT_DIR/android"
          ./gradlew --version

      - name: Analyze
        id: analyze
        continue-on-error: true
        env:
          PROJECT_DIR: ${{ steps.detect.outputs.project_dir }}
        run: |
          set +e
          cd "$PROJECT_DIR"

          flutter analyze > analyze.log 2>&1
          STATUS=$?

          cat analyze.log

          exit 0

      - name: Build APK
        id: build
        env:
          PROJECT_DIR: ${{ steps.detect.outputs.project_dir }}
          ENTRY_POINT: ${{ steps.entry.outputs.entry_point }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -e
          cd "$PROJECT_DIR"

          rm -f build_output.log
          rm -f build_error.log

          flutter clean
          flutter pub get

          set +e

          if [ "$BUILD_TYPE" = "debug" ]; then
            flutter build apk \
              --debug \
              --target="$ENTRY_POINT" \
              --android-skip-build-dependency-validation \
              2>&1 | tee build_output.log
          elif [ "$BUILD_TYPE" = "profile" ]; then
            flutter build apk \
              --profile \
              --target="$ENTRY_POINT" \
              --android-skip-build-dependency-validation \
              2>&1 | tee build_output.log
          else
            flutter build apk \
              --release \
              --target="$ENTRY_POINT" \
              --android-skip-build-dependency-validation \
              2>&1 | tee build_output.log
          fi

          STATUS=${PIPESTATUS[0]}

          cp build_output.log build_error.log

          if [ "$STATUS" -ne 0 ]; then
            echo "BUILD FAILED"
            grep -Ei \
              "error:|error |exception|failed|failure:|undefined|not found|couldn't|cannot|invalid|unsupported" \
              build_output.log \
              | tail -150 || true
            exit "$STATUS"
          fi

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ inputs.tag }}
          path: |
            project/source/**/build_output.log
            project/source/**/build_error.log
            project/source/**/analyze.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify APK
        env:
          PROJECT_DIR: ${{ steps.detect.outputs.project_dir }}
        run: |
          set -e
          cd "$PROJECT_DIR"

          APK=$(find build/app/outputs -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "APK tidak ditemukan"
            find build/app/outputs -type f -print 2>/dev/null || true
            exit 1
          fi

          mkdir -p build/final
          cp "$APK" build/final/release.apk

          test -s build/final/release.apk

          ls -lh build/final/release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk-${{ inputs.tag }}
          path: ${{ steps.detect.outputs.project_dir }}/build/final/release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Create Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          BUILD_TAG: ${{ inputs.tag }}
        run: |
          set -e

          REPO="$GITHUB_REPOSITORY"

          EXISTING=$(curl \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "User-Agent: FlutterBuildBot/2.0" \
            "https://api.github.com/repos/$REPO/releases/tags/$BUILD_TAG")

          EXISTING_ID=$(printf '%s' "$EXISTING" | python3 -c '
import json
import sys

try:
    data = json.load(sys.stdin)
    print(data.get("id", ""))
except:
    print("")
')

          if [ -n "$EXISTING_ID" ]; then
            curl \
              --silent \
              --show-error \
              --fail \
              --retry 5 \
              --retry-delay 3 \
              -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "User-Agent: FlutterBuildBot/2.0" \
              "https://api.github.com/repos/$REPO/releases/$EXISTING_ID"
          fi

          RESPONSE=$(curl \
            --silent \
            --show-error \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "User-Agent: FlutterBuildBot/2.0" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$REPO/releases" \
            -d "{\"tag_name\":\"$BUILD_TAG\",\"name\":\"Build $BUILD_TAG\",\"draft\":false,\"prerelease\":true}")

          RELEASE_ID=$(printf '%s' "$RESPONSE" | python3 -c '
import json
import sys
print(json.load(sys.stdin).get("id", ""))
')

          UPLOAD_URL=$(printf '%s' "$RESPONSE" | python3 -c '
import json
import sys
print(json.load(sys.stdin).get("upload_url", "").split("{")[0])
')

          if [ -z "$RELEASE_ID" ] || [ -z "$UPLOAD_URL" ]; then
            echo "Gagal membuat GitHub Release"
            echo "$RESPONSE"
            exit 1
          fi

          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "upload_url=$UPLOAD_URL" >> "$GITHUB_OUTPUT"

      - name: Upload APK Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          UPLOAD_URL: ${{ steps.release.outputs.upload_url }}
          PROJECT_DIR: ${{ steps.detect.outputs.project_dir }}
          BUILD_TAG: ${{ inputs.tag }}
        run: |
          set -e

          APK="$PROJECT_DIR/build/final/release.apk"
          FILE_NAME="app-$BUILD_TAG.apk"

          test -s "$APK"

          curl \
            --silent \
            --show-error \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 600 \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "User-Agent: FlutterBuildBot/2.0" \
            --data-binary "@$APK" \
            "$UPLOAD_URL?name=$FILE_NAME"

      - name: Finalize
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -e

          curl \
            --silent \
            --show-error \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "User-Agent: FlutterBuildBot/2.0" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -d '{"draft":false}'

          echo "BUILD SUCCESS"
