name: Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL GitHub Release Asset ZIP"
        required: true
        type: string

      tag:
        description: "Build tag"
        required: false
        default: "latest"
        type: string

      build_type:
        description: "Build type"
        required: false
        default: "release"
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Project ZIP
        env:
          ZIP_URL: ${{ inputs.zip_url }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -e

          mkdir -p project

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "❌ GH_PAT tidak tersedia."
            echo "Pastikan GH_PAT berada di Repository secrets."
            exit 1
          fi

          echo "📦 Downloading Flutter project..."

          curl -L \
            --fail-with-body \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            "${ZIP_URL}" \
            -o project/project.zip

          echo "📁 File information:"
          ls -lh project/project.zip
          file project/project.zip

          if ! unzip -t project/project.zip >/dev/null 2>&1; then
            echo "❌ File yang didownload bukan ZIP yang valid."
            exit 1
          fi

          echo "✅ ZIP valid."

      - name: Extract Project
        run: |
          set -e

          mkdir -p project/source

          unzip -q project/project.zip -d project/source

          echo "✅ Project berhasil diekstrak."

      - name: Find Flutter Project
        run: |
          set -e

          PROJECT_DIR=$(find project/source \
            -type f \
            -name "pubspec.yaml" \
            -printf '%h\n' \
            | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "❌ pubspec.yaml tidak ditemukan."
            echo "ZIP harus berisi project Flutter."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "✅ Flutter project ditemukan:"
          echo "$PROJECT_DIR"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Version
        run: |
          flutter --version
          dart --version

      - name: Check Flutter Project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          if [ ! -f "pubspec.yaml" ]; then
            echo "❌ pubspec.yaml tidak ditemukan."
            exit 1
          fi

          if [ ! -d "android" ]; then
            echo "❌ Folder android tidak ditemukan."
            exit 1
          fi

          echo "✅ Flutter project valid."

      - name: Fix Gradle Version
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          GRADLE_FILE="android/gradle/wrapper/gradle-wrapper.properties"

          if [ ! -f "$GRADLE_FILE" ]; then
            echo "❌ gradle-wrapper.properties tidak ditemukan."
            exit 1
          fi

          echo "📌 Gradle sebelum:"
          grep "distributionUrl" "$GRADLE_FILE" || true

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/gradle/wrapper/gradle-wrapper.properties")
          text = path.read_text()

          text = re.sub(
              r'gradle-[0-9]+\.[0-9]+(?:\.[0-9]+)?-(?:bin|all)\.zip',
              'gradle-8.14.0-bin.zip',
              text
          )

          path.write_text(text)
          PY

          echo "📌 Gradle sesudah:"
          grep "distributionUrl" "$GRADLE_FILE"

      - name: Configure Flutter Android Compatibility
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          PROPERTIES="android/gradle.properties"

          touch "$PROPERTIES"

          if grep -q "^android.newDsl=" "$PROPERTIES"; then
            sed -i 's/^android.newDsl=.*/android.newDsl=false/' "$PROPERTIES"
          else
            echo "android.newDsl=false" >> "$PROPERTIES"
          fi

          if grep -q "^android.builtInKotlin=" "$PROPERTIES"; then
            sed -i 's/^android.builtInKotlin=.*/android.builtInKotlin=false/' "$PROPERTIES"
          else
            echo "android.builtInKotlin=false" >> "$PROPERTIES"
          fi

          echo "📄 Android Gradle properties:"
          cat "$PROPERTIES"

      - name: Flutter Pub Get
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          flutter pub get

      - name: Flutter Analyze Suggestions
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: |
          flutter analyze --suggestions

      - name: Verify Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew

          echo "📌 Gradle version:"
          ./gradlew --version

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          if [ "${{ inputs.build_type }}" = "debug" ]; then
            echo "🔧 Building DEBUG APK..."
            flutter build apk --debug
          else
            echo "🚀 Building RELEASE APK..."
            flutter build apk --release
          fi

      - name: Check APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          APK_DIR="build/app/outputs/flutter-apk"

          if [ ! -d "$APK_DIR" ]; then
            echo "❌ Folder APK tidak ditemukan."
            exit 1
          fi

          echo "📦 APK hasil build:"

          find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.tag }}
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 7
