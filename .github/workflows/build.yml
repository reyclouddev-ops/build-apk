name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: Flutter project ZIP URL
        required: true
        type: string
      tag:
        description: Build tag
        required: true
        type: string
      build_type:
        description: Build type
        required: false
        default: release
        type: string

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Environment
        run: |
          flutter --version
          dart --version
          java -version

      - name: Download Project
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          set -e

          rm -rf project
          mkdir -p project/source

          if [ -z "$GH_TOKEN" ]; then
            echo "GH_PAT belum tersedia"
            exit 1
          fi

          if [ -z "$ZIP_URL" ]; then
            echo "ZIP URL belum tersedia"
            exit 1
          fi

          DOWNLOAD_URL="$ZIP_URL"

          case "$ZIP_URL" in
            https://github.com/*/releases/download/*)
              RELEASE_PATH=$(echo "$ZIP_URL" | sed 's#https://github.com/##')

              REPO=$(echo "$RELEASE_PATH" | cut -d'/' -f1-2)
              TAG_NAME=$(echo "$RELEASE_PATH" | cut -d'/' -f5)
              ASSET_NAME=$(echo "$RELEASE_PATH" | cut -d'/' -f6-)

              echo "Repository: $REPO"
              echo "Tag: $TAG_NAME"
              echo "Asset: $ASSET_NAME"

              RELEASE_JSON=$(curl \
                --silent \
                --show-error \
                --fail-with-body \
                --retry 5 \
                --retry-delay 3 \
                --connect-timeout 30 \
                --max-time 180 \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$REPO/releases/tags/$TAG_NAME")

              ASSET_ID=$(echo "$RELEASE_JSON" | python3 -c '
import sys
import json

data = json.load(sys.stdin)
name = sys.argv[1]

for asset in data.get("assets", []):
    if asset.get("name") == name:
        print(asset.get("id", ""))
        break
' "$ASSET_NAME")

              if [ -z "$ASSET_ID" ]; then
                echo "Asset tidak ditemukan"
                echo "$ASSET_NAME"
                exit 1
              fi

              DOWNLOAD_URL="https://api.github.com/repos/$REPO/releases/assets/$ASSET_ID"
              ;;
          esac

          curl \
            --location \
            --fail-with-body \
            --retry 8 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 900 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -H "User-Agent: FlutterBuildBot/2.0" \
            "$DOWNLOAD_URL" \
            --output project/project.zip

          test -s project/project.zip

          echo "ZIP berhasil didownload"
          ls -lh project/project.zip

          unzip -t project/project.zip
          unzip -q project/project.zip -d project/source

      - name: Detect Project
        id: detect
        run: |
          set -e

          PUBSPEC=$(find project/source -type f -name "pubspec.yaml" -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml tidak ditemukan"
            find project/source -maxdepth 6 -type f | head -300
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Prepare Flutter
        env:
          PROJECT_DIR: ${{ steps.detect.outputs.project_dir }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          flutter pub get

      - name: Detect Entry Point
        id: entry
        env:
          PROJECT_DIR: ${{ steps.detect.outputs.project_dir }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "lib/main.dart" ]; then
            ENTRY="lib/main.dart"
          else
            ENTRY=$(find lib -type f -name "*.dart" -print0 2>/dev/null | xargs -0 grep -l "void main(" 2>/dev/null | head -1 || true)
          fi

          if [ -z "$ENTRY" ]; then
            echo "main.dart tidak ditemukan"
            exit 1
          fi

          echo "Entry: $ENTRY"
          echo "entry=$ENTRY" >> "$GITHUB_OUTPUT"

      - name: Prepare Android
        env:
          PROJECT_DIR: ${{ steps.detect.outputs.project_dir }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name flutter_build_app .
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "gradlew tidak ditemukan"
            exit 1
          fi

          chmod +x android/gradlew

      - name: Analyze
        id: analyze
        continue-on-error: true
        env:
          PROJECT_DIR: ${{ steps.detect.outputs.project_dir }}
        run: |
          cd "$PROJECT_DIR"

          flutter analyze > analyze.log 2>&1 || true

          cat analyze.log

      - name: Build APK
        id: build
        continue-on-error: true
        env:
          PROJECT_DIR: ${{ steps.detect.outputs.project_dir }}
          ENTRY: ${{ steps.entry.outputs.entry }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set +e

          cd "$PROJECT_DIR"

          rm -f build_output.log
          rm -f build_error.log

          flutter clean
          flutter pub get

          if [ "$BUILD_TYPE" = "debug" ]; then
            flutter build apk \
              --debug \
              --target="$ENTRY" \
              --android-skip-build-dependency-validation \
              2>&1 | tee build_output.log

            STATUS=${PIPESTATUS[0]}

          elif [ "$BUILD_TYPE" = "profile" ]; then
            flutter build apk \
              --profile \
              --target="$ENTRY" \
              --android-skip-build-dependency-validation \
              2>&1 | tee build_output.log

            STATUS=${PIPESTATUS[0]}

          else
            flutter build apk \
              --release \
              --target="$ENTRY" \
              --android-skip-build-dependency-validation \
              2>&1 | tee build_output.log

            STATUS=${PIPESTATUS[0]}
          fi

          cp build_output.log build_error.log

          echo "Build status: $STATUS"

          if [ "$STATUS" -ne 0 ]; then
            echo "BUILD FAILED"
            tail -200 build_output.log
            exit "$STATUS"
          fi

          echo "BUILD SUCCESS"

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-logs-${{ inputs.tag }}
          path: |
            project/source/**/build_output.log
            project/source/**/build_error.log
            project/source/**/analyze.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop On Build Failure
        if: steps.build.outcome == 'failure'
        run: |
          echo "Build Flutter gagal"
          exit 1

      - name: Find APK
        id: apk
        env:
          PROJECT_DIR: ${{ steps.detect.outputs.project_dir }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          APK=$(find build/app/outputs -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "APK tidak ditemukan"
            find build/app/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK ditemukan:"
          ls -lh "$APK"

          mkdir -p build/final
          cp "$APK" build/final/release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk-${{ inputs.tag }}
          path: ${{ steps.detect.outputs.project_dir }}/build/final/release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Get Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TAG: ${{ inputs.tag }}
        run: |
          set -e

          RESPONSE=$(curl \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 120 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG")

          RELEASE_ID=$(echo "$RESPONSE" | python3 -c '
import sys
import json

data = json.load(sys.stdin)
print(data.get("id", ""))
')

          UPLOAD_URL=$(echo "$RESPONSE" | python3 -c '
import sys
import json

data = json.load(sys.stdin)
print(data.get("upload_url", "").split("{")[0])
')

          if [ -z "$RELEASE_ID" ]; then
            RESPONSE=$(curl \
              --silent \
              --show-error \
              --fail-with-body \
              --retry 5 \
              --retry-delay 3 \
              --connect-timeout 30 \
              --max-time 120 \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"Build $TAG\",\"draft\":false,\"prerelease\":true}")

            RELEASE_ID=$(echo "$RESPONSE" | python3 -c '
import sys
import json

data = json.load(sys.stdin)
print(data.get("id", ""))
')

            UPLOAD_URL=$(echo "$RESPONSE" | python3 -c '
import sys
import json

data = json.load(sys.stdin)
print(data.get("upload_url", "").split("{")[0])
')
          fi

          if [ -z "$RELEASE_ID" ] || [ -z "$UPLOAD_URL" ]; then
            echo "Gagal mendapatkan release"
            echo "$RESPONSE"
            exit 1
          fi

          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "upload_url=$UPLOAD_URL" >> "$GITHUB_OUTPUT"

      - name: Upload APK Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          UPLOAD_URL: ${{ steps.release.outputs.upload_url }}
          PROJECT_DIR: ${{ steps.detect.outputs.project_dir }}
          TAG: ${{ inputs.tag }}
        run: |
          set -e

          APK="$PROJECT_DIR/build/final/release.apk"
          FILE_NAME="app-$TAG.apk"

          test -s "$APK"

          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --retry 8 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 900 \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "User-Agent: FlutterBuildBot/2.0" \
            --data-binary "@$APK" \
            "$UPLOAD_URL?name=$FILE_NAME"

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -e

          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 120 \
            -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "User-Agent: FlutterBuildBot/2.0" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -d '{"draft":false}'

          echo "Release berhasil dipublish"
