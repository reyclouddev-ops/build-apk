name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: Flutter project ZIP URL
        required: true
        type: string
      tag:
        description: Build tag
        required: true
        type: string
      build_type:
        description: Build type
        required: false
        default: debug
        type: string

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.0"
          cache: true

      - name: Download Project
        env:
          ZIP_URL: ${{ inputs.zip_url }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -e

          rm -rf project
          mkdir -p project

          curl -L \
            --fail-with-body \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 600 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -H "User-Agent: FlutterBuildBot" \
            "$ZIP_URL" \
            -o project/project.zip

          test -s project/project.zip

          unzip -oq project/project.zip -d project

          rm -f project/project.zip

      - name: Find Flutter Project
        id: project
        run: |
          set -e

          ROOT="$GITHUB_WORKSPACE/project"
          SELECTED=""

          mapfile -t PUBSPECS < <(
            find "$ROOT" \
              -type f \
              -name "pubspec.yaml" \
              -not -path "*/.dart_tool/*" \
              -not -path "*/build/*" \
              -print
          )

          if [ "${#PUBSPECS[@]}" -eq 0 ]; then
            echo "Flutter project tidak ditemukan"
            exit 1
          fi

          for PUBSPEC in "${PUBSPECS[@]}"; do
            DIR="$(dirname "$PUBSPEC")"

            if [ ! -d "$DIR/lib" ]; then
              continue
            fi

            if grep -qE '^[[:space:]]*flutter:[[:space:]]*$' "$PUBSPEC"; then
              if [ -d "$DIR/android" ]; then
                SELECTED="$DIR"
                break
              fi

              if [ -z "$SELECTED" ]; then
                SELECTED="$DIR"
              fi
            fi
          done

          if [ -z "$SELECTED" ]; then
            for PUBSPEC in "${PUBSPECS[@]}"; do
              DIR="$(dirname "$PUBSPEC")"

              if [ -d "$DIR/lib" ]; then
                SELECTED="$DIR"
                break
              fi
            done
          fi

          if [ -z "$SELECTED" ]; then
            echo "Tidak dapat menentukan Flutter project"
            printf '%s\n' "${PUBSPECS[@]}"
            exit 1
          fi

          PUBSPEC="$SELECTED/pubspec.yaml"

          echo "Selected project:"
          echo "$SELECTED"

          echo "Selected pubspec:"
          echo "$PUBSPEC"

          echo "Project name:"
          grep -E '^name:' "$PUBSPEC" || true

          echo "Project version:"
          grep -E '^version:' "$PUBSPEC" || true

          echo "Flutter environment:"
          grep -A2 '^environment:' "$PUBSPEC" || true

          echo "Dependencies:"
          sed -n '/^dependencies:/,/^dev_dependencies:/p' "$PUBSPEC" || true

          echo "dir=$SELECTED" >> "$GITHUB_OUTPUT"
          echo "pubspec=$PUBSPEC" >> "$GITHUB_OUTPUT"

      - name: Prepare Project
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          test -f pubspec.yaml

          echo "Working directory:"
          pwd

          echo "Flutter:"
          flutter --version

          echo "Dart:"
          dart --version

          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi

          flutter clean

          rm -rf .dart_tool
          rm -rf build

          flutter pub get

          test -f pubspec.lock

      - name: Fix Dart 3.13 Compatibility
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          if grep -qE '^[[:space:]]*dartssh2:' pubspec.yaml; then
            LOCK_VERSION=$(awk '
              /^  dartssh2:/ {
                found=1
                next
              }
              found && /^[[:space:]]+version:/ {
                gsub(/"/, "", $2)
                print $2
                exit
              }
              found && /^  [a-zA-Z0-9_]+:/ {
                exit
              }
            ' pubspec.lock)

            if [ "$LOCK_VERSION" = "2.14.0" ]; then
              TARGET="$HOME/.pub-cache/hosted/pub.dev/dartssh2-$LOCK_VERSION/lib/src/sftp/sftp_client.dart"

              if [ -f "$TARGET" ]; then
                python3 -c 'import sys; p=sys.argv[1]; d=open(p, encoding="utf-8").read(); old="if (bytessRecieved >= length) {"; new="if (length != null && bytessRecieved >= length) {"; d=d.replace(old,new,1); open(p,"w",encoding="utf-8").write(d); print("dartssh2 compatibility patch applied")' "$TARGET"
              fi
            fi
          fi

      - name: Configure Android
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          mkdir -p android

          touch android/gradle.properties

          if ! grep -q '^android.useAndroidX=' android/gradle.properties; then
            echo 'android.useAndroidX=true' >> android/gradle.properties
          fi

          if ! grep -q '^android.enableJetifier=' android/gradle.properties; then
            echo 'android.enableJetifier=true' >> android/gradle.properties
          fi

          if ! grep -q '^org.gradle.jvmargs=' android/gradle.properties; then
            echo 'org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8' >> android/gradle.properties
          fi

      - name: Build APK
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          case "$BUILD_TYPE" in
            debug)
              flutter build apk --debug
              ;;
            profile)
              flutter build apk --profile
              ;;
            release)
              flutter build apk --release
              ;;
            *)
              echo "Build type tidak valid: $BUILD_TYPE"
              exit 1
              ;;
          esac

      - name: Find APK
        id: apk
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -e

          APK="$(find "$PROJECT_DIR/build/app/outputs" \
            -type f \
            -name "*.apk" \
            -print \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "APK tidak ditemukan"

            find "$PROJECT_DIR/build" \
              -type f \
              -print \
              2>/dev/null || true

            exit 1
          fi

          echo "APK:"
          echo "$APK"

          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk-${{ inputs.tag }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TAG: ${{ inputs.tag }}
        run: |
          set -e

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Build $TAG" \
            --prerelease \
            --draft \
            --generate-notes=false

      - name: Upload APK Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TAG: ${{ inputs.tag }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          set -e

          gh release upload "$TAG" \
            "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TAG: ${{ inputs.tag }}
        run: |
          set -e

          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
