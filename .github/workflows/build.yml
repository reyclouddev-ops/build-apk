name: Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL GitHub Release Asset ZIP"
        required: true
        type: string

      tag:
        description: "Build tag"
        required: false
        default: "latest"
        type: string

      build_type:
        description: "Build type"
        required: false
        default: "release"
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Project ZIP
        env:
          ZIP_URL: ${{ inputs.zip_url }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -e

          mkdir -p project

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "GH_PAT tidak tersedia."
            exit 1
          fi

          curl -L \
            --retry 5 \
            --retry-delay 3 \
            --fail-with-body \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            "$ZIP_URL" \
            -o project/project.zip

          file project/project.zip

          unzip -t project/project.zip >/dev/null

      - name: Extract Project
        run: |
          set -e

          mkdir -p project/source

          unzip -q project/project.zip -d project/source

      - name: Find Flutter Project
        run: |
          set -e

          PROJECT_DIR=$(find project/source \
            -type f \
            -name "pubspec.yaml" \
            -printf '%h\n' \
            | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Flutter project tidak ditemukan."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project:"
          echo "$PROJECT_DIR"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Verify Tools
        run: |
          set -e

          java -version
          flutter --version
          gradle --version

      - name: Validate Project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          test -f pubspec.yaml
          test -d android

      - name: Fix Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          FILE="android/gradle/wrapper/gradle-wrapper.properties"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/gradle/wrapper/gradle-wrapper.properties")

          text = path.read_text()

          text = re.sub(
              r'https?://[^\\s]+/distributions/gradle-[^\\s]+\\.zip',
              'https://services.gradle.org/distributions/gradle-8.14.0-bin.zip',
              text
          )

          text = re.sub(
              r'gradle-[0-9]+\\.[0-9]+(?:\\.[0-9]+)?-(?:bin|all)\\.zip',
              'gradle-8.14.0-bin.zip',
              text
          )

          path.write_text(text)
          PY

          cat "$FILE"

      - name: Fix Kotlin
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/settings.gradle"),
              Path("android/settings.gradle.kts"),
              Path("android/build.gradle"),
              Path("android/build.gradle.kts")
          ]

          for path in files:
              if not path.exists():
                  continue

              text = path.read_text()

              text = re.sub(
                  r'(org\\.jetbrains\\.kotlin\\.android["\\']?\\s+version\\s+["\\'])[0-9.]+(["\\'])',
                  r'\\g<1>2.2.21\\g<2>',
                  text
              )

              text = re.sub(
                  r'(id\\(["\\']org\\.jetbrains\\.kotlin\\.android["\\']\\)\\s+version\\s+["\\'])[0-9.]+(["\\'])',
                  r'\\g<1>2.2.21\\g<2>',
                  text
              )

              text = re.sub(
                  r'(kotlin\\(["\\']android["\\']\\)\\s+version\\s+["\\'])[0-9.]+(["\\'])',
                  r'\\g<1>2.2.21\\g<2>',
                  text
              )

              path.write_text(text)
          PY

      - name: Configure Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          FILE="android/gradle.properties"

          touch "$FILE"

          if grep -q "^android.newDsl=" "$FILE"; then
            sed -i 's/^android.newDsl=.*/android.newDsl=false/' "$FILE"
          else
            echo "android.newDsl=false" >> "$FILE"
          fi

          if grep -q "^android.builtInKotlin=" "$FILE"; then
            sed -i 's/^android.builtInKotlin=.*/android.builtInKotlin=false/' "$FILE"
          else
            echo "android.builtInKotlin=false" >> "$FILE"
          fi

      - name: Flutter Pub Get
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          flutter pub get

      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -e

          chmod +x gradlew

          echo "Gradle wrapper configured:"
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"
        run: |
          set -e

          flutter clean
          flutter pub get

          if [ "${{ inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          APK_DIR="build/app/outputs/flutter-apk"

          if [ ! -d "$APK_DIR" ]; then
            echo "APK directory tidak ditemukan."
            exit 1
          fi

          find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;

          COUNT=$(find "$APK_DIR" -type f -name "*.apk" | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo "APK tidak ditemukan."
            exit 1
          fi

          echo "APK berhasil dibuat."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.tag }}
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 7
