name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: Flutter project ZIP URL
        required: true
        type: string

      tag:
        description: Build tag
        required: true
        type: string

      build_type:
        description: Build type
        required: false
        default: release
        type: string

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FLUTTER_VERSION: "3.47.0"
      JAVA_VERSION: "17"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Show Environment
        run: |
          set -e

          echo "======================================"
          echo "Flutter"
          echo "======================================"
          flutter --version

          echo "======================================"
          echo "Dart"
          echo "======================================"
          dart --version

          echo "======================================"
          echo "Java"
          echo "======================================"
          java -version

          echo "======================================"
          echo "GitHub Runner"
          echo "======================================"
          uname -a

          echo "======================================"

      - name: Download Project
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          set -e

          rm -rf project
          mkdir -p project/source

          if [ -z "$GH_TOKEN" ]; then
            echo "GH_PAT belum tersedia."
            exit 1
          fi

          if [ -z "$ZIP_URL" ]; then
            echo "ZIP_URL belum tersedia."
            exit 1
          fi

          echo "ZIP URL:"
          echo "$ZIP_URL"

          DOWNLOAD_URL="$ZIP_URL"

          if echo "$ZIP_URL" | grep -q "github.com/.*/releases/download/"; then

            RELEASE_PATH=$(echo "$ZIP_URL" | sed -E 's#https://github.com/([^/]+/[^/]+)/releases/download/(.*)#\1|\2#')

            REPO=$(echo "$RELEASE_PATH" | cut -d'|' -f1)
            RELEASE_PART=$(echo "$RELEASE_PATH" | cut -d'|' -f2)

            TAG_NAME=$(echo "$RELEASE_PART" | sed 's#/.*##')
            ASSET_NAME=$(echo "$RELEASE_PART" | sed "s#^[^/]*/##")

            echo "Repository: $REPO"
            echo "Tag: $TAG_NAME"
            echo "Asset: $ASSET_NAME"

            RELEASE_JSON=$(curl \
              --silent \
              --show-error \
              --fail-with-body \
              --retry 5 \
              --retry-delay 3 \
              --connect-timeout 30 \
              --max-time 120 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "User-Agent: FlutterBuildBot/2.0" \
              "https://api.github.com/repos/$REPO/releases/tags/$TAG_NAME")

            ASSET_ID=$(echo "$RELEASE_JSON" | jq -r \
              --arg NAME "$ASSET_NAME" \
              '.assets[]? | select(.name == $NAME) | .id' \
              | head -1)

            if [ -z "$ASSET_ID" ] || [ "$ASSET_ID" = "null" ]; then
              echo "Asset $ASSET_NAME tidak ditemukan."

              echo "Assets yang tersedia:"
              echo "$RELEASE_JSON" | jq -r \
                '.assets[]? | "- \(.name) | ID: \(.id)"'

              exit 1
            fi

            DOWNLOAD_URL="https://api.github.com/repos/$REPO/releases/assets/$ASSET_ID"

            echo "API Asset URL:"
            echo "$DOWNLOAD_URL"
          fi

          rm -f project/project.zip

          curl \
            --location \
            --fail-with-body \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 600 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -H "User-Agent: FlutterBuildBot/2.0" \
            "$DOWNLOAD_URL" \
            --output project/project.zip

          test -s project/project.zip

          echo "Ukuran ZIP:"
          ls -lh project/project.zip

          echo "Tipe file:"
          file project/project.zip

          echo "Memeriksa ZIP:"
          unzip -t project/project.zip

          echo "Mengekstrak project:"
          unzip -q project/project.zip -d project/source

          echo "Project ZIP berhasil diekstrak."

      - name: Detect Flutter Project
        id: detect
        run: |
          set -e

          PUBSPEC=$(find project/source \
            -type f \
            -name "pubspec.yaml" \
            -print \
            -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml tidak ditemukan."

            echo "Struktur project:"
            find project/source \
              -maxdepth 6 \
              -type f \
              -print \
              | sort \
              | head -300

            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project ditemukan:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Prepare Flutter
        env:
          PROJECT_DIR: ${{ steps.detect.outputs.project_dir }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Flutter version:"
          flutter --version

          echo "Pub get:"
          flutter pub get

      - name: Detect Entry Point
        id: entry
        env:
          PROJECT_DIR: ${{ steps.detect.outputs.project_dir }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          ENTRY=""

          if [ -f "lib/main.dart" ]; then
            ENTRY="lib/main.dart"
          else
            ENTRY=$(find lib \
              -type f \
              -name "*.dart" \
              -print0 2>/dev/null \
              | xargs -0 grep -l "void main(" 2>/dev/null \
              | head -1 || true)
          fi

          if [ -z "$ENTRY" ]; then
            echo "Entry point Flutter tidak ditemukan."

            find lib \
              -type f \
              -name "*.dart" \
              -print \
              2>/dev/null \
              | sort || true

            exit 1
          fi

          echo "Entry point:"
          echo "$ENTRY"

          echo "entry_point=$ENTRY" >> "$GITHUB_OUTPUT"

      - name: Prepare Android Platform
        env:
          PROJECT_DIR: ${{ steps.detect.outputs.project_dir }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -d "android" ]; then
            echo "Folder android tidak ditemukan."
            echo "Membuat Android platform..."

            flutter create \
              --platforms=android \
              --project-name flutter_build_app \
              .
          else
            echo "Folder android sudah tersedia."
            echo "Konfigurasi Android tidak ditimpa."
          fi

          test -d android

          if [ -f "android/settings.gradle.kts" ]; then
            echo "settings.gradle.kts ditemukan."
          elif [ -f "android/settings.gradle" ]; then
            echo "settings.gradle ditemukan."
          else
            echo "Android settings tidak ditemukan."
            exit 1
          fi

          if [ -f "android/app/build.gradle.kts" ]; then
            echo "build.gradle.kts ditemukan."
          elif [ -f "android/app/build.gradle" ]; then
            echo "build.gradle ditemukan."
          else
            echo "Android app Gradle file tidak ditemukan."
            exit 1
          fi

      - name: Check Android Configuration
        env:
          PROJECT_DIR: ${{ steps.detect.outputs.project_dir }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "ANDROID CONFIGURATION"
          echo "======================================"

          if [ -f android/settings.gradle.kts ]; then
            echo "--- settings.gradle.kts ---"
            cat android/settings.gradle.kts
          elif [ -f android/settings.gradle ]; then
            echo "--- settings.gradle ---"
            cat android/settings.gradle
          fi

          echo "======================================"

          if [ -f android/app/build.gradle.kts ]; then
            echo "--- app/build.gradle.kts ---"
            cat android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            echo "--- app/build.gradle ---"
            cat android/app/build.gradle
          fi

          echo "======================================"

          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            echo "--- gradle-wrapper.properties ---"
            cat android/gradle/wrapper/gradle-wrapper.properties
          else
            echo "gradle-wrapper.properties tidak ditemukan."
          fi

      - name: Verify Gradle
        env:
          PROJECT_DIR: ${{ steps.detect.outputs.project_dir }}
        run: |
          set -e

          cd "$PROJECT_DIR/android"

          if [ ! -f gradlew ]; then
            echo "gradlew tidak ditemukan."

            cd ..

            flutter pub get

            if [ ! -f android/gradlew ]; then
              echo "Gradle wrapper tetap tidak ditemukan."
              exit 1
            fi

            cd android
          fi

          chmod +x gradlew

          echo "Gradle version:"
          ./gradlew --version

      - name: Flutter Analyze
        id: analyze
        continue-on-error: true
        env:
          PROJECT_DIR: ${{ steps.detect.outputs.project_dir }}
        run: |
          cd "$PROJECT_DIR"

          echo "Menjalankan Flutter Analyze..."

          set +e

          flutter analyze > analyze.log 2>&1

          STATUS=$?

          cat analyze.log

          echo "Analyze exit code: $STATUS"

          if [ "$STATUS" -ne 0 ]; then
            echo "Flutter analyze menemukan masalah."
            echo "Build tetap dilanjutkan."
          else
            echo "Flutter analyze bersih."
          fi

          exit 0

      - name: Build APK
        id: build
        continue-on-error: true
        env:
          PROJECT_DIR: ${{ steps.detect.outputs.project_dir }}
          ENTRY_POINT: ${{ steps.entry.outputs.entry_point }}
          BUILD_TYPE: ${{ inputs.build_type }}
          BUILD_TAG: ${{ inputs.tag }}
        run: |
          cd "$PROJECT_DIR"

          echo "======================================"
          echo "FLUTTER APK BUILD"
          echo "======================================"
          echo "Tag        : $BUILD_TAG"
          echo "Build Type : $BUILD_TYPE"
          echo "Project    : $PROJECT_DIR"
          echo "Entry Point: $ENTRY_POINT"
          echo "======================================"

          rm -f build_error.log
          rm -f build_output.log

          flutter clean
          flutter pub get

          echo "======================================"
          echo "FLUTTER VERSION"
          echo "======================================"

          flutter --version

          echo "======================================"
          echo "BUILD START"
          echo "======================================"

          set +e

          if [ "$BUILD_TYPE" = "debug" ]; then

            flutter build apk \
              --debug \
              --target="$ENTRY_POINT" \
              --android-skip-build-dependency-validation \
              -v \
              2>&1 | tee build_output.log

            STATUS=${PIPESTATUS[0]}

          elif [ "$BUILD_TYPE" = "profile" ]; then

            flutter build apk \
              --profile \
              --target="$ENTRY_POINT" \
              --android-skip-build-dependency-validation \
              -v \
              2>&1 | tee build_output.log

            STATUS=${PIPESTATUS[0]}

          else

            flutter build apk \
              --release \
              --target="$ENTRY_POINT" \
              --android-skip-build-dependency-validation \
              -v \
              2>&1 | tee build_output.log

            STATUS=${PIPESTATUS[0]}

          fi

          echo "Build exit code: $STATUS"

          cp build_output.log build_error.log

          if [ "$STATUS" -ne 0 ]; then

            echo "======================================"
            echo "BUILD FAILED"
            echo "======================================"

            echo "Error summary:"

            grep -Ei \
              "error:|error |exception|failed|failure:|undefined|not found|couldn't|cannot|invalid|unsupported" \
              build_output.log \
              | tail -150 || true

            exit "$STATUS"
          fi

          echo "======================================"
          echo "BUILD SUCCESS"
          echo "======================================"

          exit 0

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-logs-${{ inputs.tag }}
          path: |
            ${{ steps.detect.outputs.project_dir }}/build_output.log
            ${{ steps.detect.outputs.project_dir }}/build_error.log
            ${{ steps.detect.outputs.project_dir }}/analyze.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop If Build Failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "======================================"
          echo "BUILD FAILED"
          echo "======================================"

          echo "Log lengkap sudah diupload sebagai artifact."

          exit 1

      - name: Verify APK
        env:
          PROJECT_DIR: ${{ steps.detect.outputs.project_dir }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          APK=$(find build/app/outputs \
            -type f \
            -name "*.apk" \
            -print \
            -quit)

          if [ -z "$APK" ]; then
            echo "APK tidak ditemukan."

            find build/app/outputs \
              -type f \
              -print \
              2>/dev/null || true

            exit 1
          fi

          echo "APK ditemukan:"
          ls -lh "$APK"

          echo "apk_path=$APK" >> "$GITHUB_ENV"

      - name: Prepare Release APK
        env:
          PROJECT_DIR: ${{ steps.detect.outputs.project_dir }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          rm -rf build/final
          mkdir -p build/final

          APK=$(find build/app/outputs \
            -type f \
            -name "*.apk" \
            -print \
            -quit)

          if [ -z "$APK" ]; then
            echo "APK tidak ditemukan."
            exit 1
          fi

          cp "$APK" build/final/release.apk

          test -f build/final/release.apk

          echo "Final APK:"
          ls -lh build/final/release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk-${{ inputs.tag }}
          path: ${{ steps.detect.outputs.project_dir }}/build/final/release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Create Or Get GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          BUILD_TAG: ${{ inputs.tag }}
        run: |
          set -e

          if [ -z "$GH_TOKEN" ]; then
            echo "GH_PAT belum tersedia."
            exit 1
          fi

          REPO="$GITHUB_REPOSITORY"

          echo "Repository: $REPO"
          echo "Release tag: $BUILD_TAG"

          HTTP_CODE=$(curl \
            --silent \
            --output release.json \
            --write-out "%{http_code}" \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 120 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "User-Agent: FlutterBuildBot/2.0" \
            "https://api.github.com/repos/$REPO/releases/tags/$BUILD_TAG")

          if [ "$HTTP_CODE" = "200" ]; then

            echo "Release sudah ada."

            RELEASE_ID=$(jq -r '.id // empty' release.json)
            UPLOAD_URL=$(jq -r '.upload_url // empty' release.json)

          elif [ "$HTTP_CODE" = "404" ]; then

            echo "Release belum ada. Membuat release baru..."

            RESPONSE=$(curl \
              --silent \
              --show-error \
              --fail-with-body \
              --retry 5 \
              --retry-delay 3 \
              --connect-timeout 30 \
              --max-time 120 \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "User-Agent: FlutterBuildBot/2.0" \
              "https://api.github.com/repos/$REPO/releases" \
              -d "$(jq -n \
                --arg tag "$BUILD_TAG" \
                '{
                  tag_name: $tag,
                  name: ("Build " + $tag),
                  draft: false,
                  prerelease: true,
                  generate_release_notes: false
                }'
              )")

            RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id // empty')
            UPLOAD_URL=$(echo "$RESPONSE" | jq -r '.upload_url // empty')

          else

            echo "Gagal mengambil release."
            echo "HTTP: $HTTP_CODE"
            cat release.json

            exit 1

          fi

          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "Release ID tidak ditemukan."
            exit 1
          fi

          if [ -z "$UPLOAD_URL" ] || [ "$UPLOAD_URL" = "null" ]; then
            echo "Upload URL tidak ditemukan."
            exit 1
          fi

          UPLOAD_URL=$(echo "$UPLOAD_URL" | sed 's/{.*//')

          echo "Release ID: $RELEASE_ID"
          echo "Upload URL: $UPLOAD_URL"

          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "upload_url=$UPLOAD_URL" >> "$GITHUB_OUTPUT"

      - name: Remove Existing APK Asset
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -e

          FILE_NAME="app-${{ inputs.tag }}.apk"

          echo "Mengecek asset lama: $FILE_NAME"

          ASSETS_JSON=$(curl \
            --silent \
            --show-error \
            --fail-with-body \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 120 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "User-Agent: FlutterBuildBot/2.0" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100")

          ASSET_ID=$(echo "$ASSETS_JSON" | jq -r \
            --arg NAME "$FILE_NAME" \
            '.[] | select(.name == $NAME) | .id' \
            | head -1)

          if [ -n "$ASSET_ID" ] && [ "$ASSET_ID" != "null" ]; then

            echo "Asset lama ditemukan: $ASSET_ID"
            echo "Menghapus asset lama..."

            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --retry 5 \
              --retry-delay 3 \
              --connect-timeout 30 \
              --max-time 120 \
              -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "User-Agent: FlutterBuildBot/2.0" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID"

            echo "Asset lama berhasil dihapus."

          else

            echo "Asset lama tidak ditemukan."

          fi

      - name: Upload APK To GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          UPLOAD_URL: ${{ steps.release.outputs.upload_url }}
          PROJECT_DIR: ${{ steps.detect.outputs.project_dir }}
        run: |
          set -e

          APK="$PROJECT_DIR/build/final/release.apk"

          test -f "$APK"

          FILE_NAME="app-${{ inputs.tag }}.apk"

          echo "Upload APK:"
          echo "$FILE_NAME"

          RESPONSE=$(curl \
            --silent \
            --show-error \
            --fail-with-body \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 600 \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "User-Agent: FlutterBuildBot/2.0" \
            --data-binary "@$APK" \
            "$UPLOAD_URL?name=$FILE_NAME")

          echo "$RESPONSE" | jq -r '
            {
              id: .id,
              name: .name,
              size: .size,
              browser_download_url: .browser_download_url
            }
          '

          ASSET_ID=$(echo "$RESPONSE" | jq -r '.id // empty')

          if [ -z "$ASSET_ID" ]; then
            echo "Upload APK gagal."
            echo "$RESPONSE"
            exit 1
          fi

          echo "APK berhasil diupload."
          echo "Asset ID: $ASSET_ID"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -e

          echo "Publish release..."

          RESPONSE=$(curl \
            --silent \
            --show-error \
            --fail-with-body \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 120 \
            -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "User-Agent: FlutterBuildBot/2.0" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -d '{"draft":false}')

          PUBLISHED=$(echo "$RESPONSE" | jq -r '.draft // true')

          if [ "$PUBLISHED" = "true" ]; then
            echo "Release masih draft."
            echo "$RESPONSE"
            exit 1
          fi

          echo "Release berhasil dipublish."

      - name: Build Summary
        if: success()
        env:
          BUILD_TAG: ${{ inputs.tag }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          echo "======================================"
          echo "BUILD SELESAI"
          echo "======================================"
          echo "Tag        : $BUILD_TAG"
          echo "Build Type : $BUILD_TYPE"
          echo "Repository : $GITHUB_REPOSITORY"
          echo "======================================"
